// ── TYPE SYSTEM ──────────────────────────────────────────────────────────────
const TYPES = [
  "Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison",
  "Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"
];
const TI = Object.fromEntries(TYPES.map((t,i) => [t,i]));

// Type colors
const TYPE_COLORS = {
  Normal:"#a8a878",Fire:"#f08030",Water:"#6890f0",Electric:"#f8d030",
  Grass:"#78c850",Ice:"#98d8d8",Fighting:"#c03028",Poison:"#a040a0",
  Ground:"#e0c068",Flying:"#a890f0",Psychic:"#f85888",Bug:"#a8b820",
  Rock:"#b8a038",Ghost:"#705898",Dragon:"#7038f8",Dark:"#705848",
  Steel:"#b8b8d0",Fairy:"#ee99ac"
};

// Effectiveness chart: CHART[atk][def] = multiplier
// Only store non-1x values as sparse map for compactness
const E = { i: 0, h: 0.5, s: 2 }; // immune, half, super
const SPARSE = {
  Normal:   { Rock:"h", Ghost:"i", Steel:"h" },
  Fire:     { Fire:"h", Water:"h", Grass:"s", Ice:"s", Bug:"s", Rock:"h", Dragon:"h", Steel:"s" },
  Water:    { Fire:"s", Water:"h", Grass:"h", Ground:"s", Rock:"s", Dragon:"h" },
  Electric: { Water:"s", Electric:"h", Grass:"h", Ground:"i", Flying:"s", Dragon:"h" },
  Grass:    { Fire:"h", Water:"s", Grass:"h", Poison:"h", Ground:"s", Flying:"h", Bug:"h", Rock:"s", Dragon:"h", Steel:"h" },
  Ice:      { Fire:"h", Water:"h", Grass:"s", Ice:"h", Ground:"s", Flying:"s", Dragon:"s", Steel:"h" },
  Fighting: { Normal:"s", Ice:"s", Poison:"h", Flying:"h", Psychic:"h", Bug:"h", Rock:"s", Ghost:"i", Dark:"s", Steel:"s", Fairy:"h" },
  Poison:   { Grass:"s", Poison:"h", Ground:"h", Rock:"h", Ghost:"h", Steel:"i", Fairy:"s" },
  Ground:   { Fire:"s", Electric:"s", Grass:"h", Poison:"s", Flying:"i", Bug:"h", Rock:"s", Steel:"s" },
  Flying:   { Electric:"h", Grass:"s", Fighting:"s", Bug:"s", Rock:"h", Steel:"h" },
  Psychic:  { Fighting:"s", Poison:"s", Psychic:"h", Dark:"i", Steel:"h" },
  Bug:      { Fire:"h", Grass:"s", Fighting:"h", Poison:"h", Flying:"h", Psychic:"s", Ghost:"h", Dark:"s", Steel:"h", Fairy:"h" },
  Rock:     { Fire:"s", Ice:"s", Fighting:"h", Ground:"h", Flying:"s", Bug:"s", Steel:"h" },
  Ghost:    { Normal:"i", Psychic:"s", Ghost:"s", Dark:"h" },
  Dragon:   { Dragon:"s", Steel:"h", Fairy:"i" },
  Dark:     { Fighting:"h", Psychic:"s", Ghost:"s", Dark:"h", Fairy:"h" },
  Steel:    { Fire:"h", Water:"h", Electric:"h", Ice:"s", Rock:"s", Steel:"h", Fairy:"s" },
  Fairy:    { Fire:"h", Poison:"h", Fighting:"s", Dragon:"s", Dark:"s", Steel:"h" },
};

function getEffectiveness(atkType, defType) {
  const entry = SPARSE[atkType]?.[defType];
  return entry ? E[entry] : 1;
}

function getDefensiveMultiplier(atkType, defTypes) {
  return defTypes.reduce((m, dt) => m * getEffectiveness(atkType, dt), 1);
}

// ── ANALYSIS ENGINE ──────────────────────────────────────────────────────────
function analyzeTeamDefense(team) {
  // For each attacking type, find best (lowest) multiplier across team
  return TYPES.map(atkType => {
    const matchups = team.map(p => ({
      name: p.name,
      mult: getDefensiveMultiplier(atkType, p.types)
    }));
    const best = Math.min(...matchups.map(m => m.mult));
    const worst = Math.max(...matchups.map(m => m.mult));
    const immuneMon = matchups.find(m => m.mult === 0);
    const resistMon = matchups.find(m => m.mult < 1 && m.mult > 0);
    const weakMons = matchups.filter(m => m.mult > 1);
    return {
      type: atkType,
      bestMult: best,
      worstMult: worst,
      immuneMon, resistMon,
      weakCount: weakMons.length,
      weakMons,
      teamSize: team.length
    };
  });
}

function analyzeTeamOffense(team) {
  // For each defending type, check if any team member has STAB coverage
  return TYPES.map(defType => {
    const coverage = team.flatMap(p =>
      p.types.map(t => ({ name: p.name, atkType: t, mult: getEffectiveness(t, defType) }))
    );
    const superEffective = coverage.filter(c => c.mult > 1);
    const bestMult = Math.max(...coverage.map(c => c.mult), 0);
    return {
      type: defType,
      covered: superEffective.length > 0,
      bestMult,
      coveredBy: superEffective
    };
  });
}

function suggestPokemon(team, game, limit = 8) {
  const defense = analyzeTeamDefense(team);
  const offense = analyzeTeamOffense(team);
  const weakTypes = defense.filter(d => d.bestMult >= 2).map(d => d.type);
  const uncoveredTypes = offense.filter(o => !o.covered).map(o => o.type);
  const teamNames = new Set(team.map(p => p.name));
  const candidates = POKEMON
    .filter(p => (game === "Both" || p.game === "B" || p.game === game[0]))
    .filter(p => !teamNames.has(p.name));

  const scored = candidates.map(p => {
    let score = 0;
    // Reward: resists team weaknesses
    for (const wt of weakTypes) {
      const mult = getDefensiveMultiplier(wt, p.types);
      if (mult === 0) score += 3;
      else if (mult < 1) score += 2;
    }
    // Reward: STAB covers uncovered types
    for (const ut of uncoveredTypes) {
      for (const t of p.types) {
        if (getEffectiveness(t, ut) > 1) score += 1.5;
      }
    }
    return { ...p, score };
  });

  return scored.sort((a, b) => b.score - a.score).slice(0, limit);
}

// ── UI COMPONENTS ────────────────────────────────────────────────────────────
const TypeBadge = ({ type, small }) => (
  <span style={{
    display: "inline-block",
    padding: small ? "1px 6px" : "2px 10px",
    borderRadius: 4,
    fontSize: small ? 10 : 12,
    fontWeight: 700,
    fontFamily: "'Space Mono', monospace",
    color: "#fff",
    background: TYPE_COLORS[type],
    textShadow: "0 1px 2px rgba(0,0,0,0.4)",
    letterSpacing: 0.5,
  }}>{type}</span>
);

const MultBadge = ({ mult }) => {
  const bg = mult === 0 ? "#333" : mult < 1 ? "#2a6e3f" : mult === 1 ? "#555" : mult <= 2 ? "#b85c1f" : "#a02020";
  const label = mult === 0 ? "0×" : mult === 0.25 ? "¼×" : mult === 0.5 ? "½×" : `${mult}×`;
  return (
    <span style={{
      display: "inline-block", padding: "1px 6px", borderRadius: 3,
      fontSize: 11, fontWeight: 700, fontFamily: "'Space Mono', monospace",
      color: "#fff", background: bg, minWidth: 28, textAlign: "center"
    }}>{label}</span>
  );
};

function ThemeToggle({ dark, onToggle }) {
  return (
    <button
      onClick={onToggle}
      aria-label={dark ? "Switch to light mode" : "Switch to dark mode"}
      style={{
        width: 36, height: 36, borderRadius: 8, cursor: "pointer",
        border: dark ? "1px solid #333" : "1px solid #ddd8c9",
        background: dark ? "#1a1e28" : "#ffffff",
        color: dark ? "#e8e6dc" : "#231f16",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 16, flexShrink: 0,
      }}
    >
      {dark ? "☀" : "☾"}
    </button>
  );
}

function PokemonSearch({ value, onChange, game, placeholder, theme }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);

  const filtered = useMemo(() => {
    if (!query) return [];
    const q = query.toLowerCase();
    return POKEMON
      .filter(p => (game === "Both" || p.game === "B" || p.game === game[0]))
      .filter(p => p.name.toLowerCase().includes(q))
      .slice(0, 12);
  }, [query, game]);

  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        value={value ? value.name : query}
        placeholder={placeholder || "Search Pokémon..."}
        onChange={e => { setQuery(e.target.value); onChange(null); setOpen(true); }}
        onFocus={() => { if (!value) setOpen(true); }}
        style={{
          width: "100%", padding: "8px 10px", borderRadius: 6,
          border: `1px solid ${theme.border}`, background: theme.inputBg, color: theme.text,
          fontFamily: "'Space Mono', monospace", fontSize: 13, boxSizing: "border-box"
        }}
      />
      {value && (
        <button onClick={() => { onChange(null); setQuery(""); }}
          style={{
            position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)",
            background: "none", border: "none", color: theme.textDim, cursor: "pointer", fontSize: 16
          }}>×</button>
      )}
      {open && filtered.length > 0 && !value && (
        <div style={{
          position: "absolute", top: "100%", left: 0, right: 0, zIndex: 100,
          background: theme.panel2, border: `1px solid ${theme.border}`, borderRadius: 6,
          maxHeight: 200, overflowY: "auto", marginTop: 2,
        }}>
          {filtered.map(p => (
            <div key={p.name}
              onClick={() => { onChange(p); setQuery(""); setOpen(false); }}
              style={{
                padding: "6px 10px", cursor: "pointer", display: "flex",
                alignItems: "center", gap: 6, borderBottom: `1px solid ${theme.border2}`
              }}
              onMouseEnter={e => e.currentTarget.style.background = theme.panel3}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <span style={{ color: theme.text, fontSize: 13, flex: 1 }}>{p.name}</span>
              {p.types.map(t => <TypeBadge key={t} type={t} small />)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(true);
  const theme = getTheme(dark);

  const [game, setGame] = useState("Shield");
  const [team, setTeam] = useState([null, null, null, null, null, null]);
  const [tab, setTab] = useState("coverage");
  const [opponent, setOpponent] = useState(null);

  const gameLetter = game[0]; // "S" or "R"
  const isValidForGame = useCallback((p) => !p || p.game === "B" || p.game === gameLetter, [gameLetter]);

  // Only Pokémon valid for the current game feed the analysis engines.
  const activeTeam = team.filter(p => p && isValidForGame(p));
  const invalidSlots = team.filter(p => p && !isValidForGame(p));

  const defense = useMemo(() => activeTeam.length ? analyzeTeamDefense(activeTeam) : [], [activeTeam]);
  const offense = useMemo(() => activeTeam.length ? analyzeTeamOffense(activeTeam) : [], [activeTeam]);
  const suggestions = useMemo(() =>
    activeTeam.length >= 1 && activeTeam.length < 6
      ? suggestPokemon(activeTeam, game)
      : [],
    [activeTeam, game]
  );

  const setSlot = useCallback((i, p) => {
    setTeam(t => { const n = [...t]; n[i] = p; return n; });
  }, []);

  const opponentAnalysis = useMemo(() => {
    if (!opponent || !activeTeam.length) return null;
    return opponent.pokemon.map(opp => {
      const matchups = activeTeam.map(mine => {
        // My offensive STAB vs their types
        const myAtk = Math.max(...mine.types.map(t =>
          opp.types.reduce((m, dt) => m * getEffectiveness(t, dt), 1)
        ));
        // Their offensive STAB vs my types
        const theirAtk = Math.max(...opp.types.map(t =>
          mine.types.reduce((m, dt) => m * getEffectiveness(t, dt), 1)
        ));
        return { myMon: mine.name, myAtk, theirAtk };
      });
      const bestCounter = matchups.reduce((best, m) =>
        (m.myAtk > best.myAtk || (m.myAtk === best.myAtk && m.theirAtk < best.theirAtk)) ? m : best
      , matchups[0]);
      return { opp, matchups, bestCounter };
    });
  }, [opponent, activeTeam]);

  return (
    <div style={{
      minHeight: "100vh", background: theme.bg, color: theme.text,
      fontFamily: "'Inter', 'Helvetica Neue', sans-serif", padding: "0 0 40px",
      transition: "background 0.15s, color 0.15s",
    }}>
      {/* Header */}
      <div style={{
        background: `linear-gradient(135deg, ${theme.headerGradFrom} 0%, ${theme.headerGradTo} 100%)`,
        borderBottom: `1px solid ${theme.border}`, padding: "20px 16px 16px",
      }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <div>
              <h1 style={{
                fontFamily: "'Space Mono', monospace", fontSize: 22, margin: 0,
                color: theme.accent, letterSpacing: 1,
              }}>TEAM BUILDER</h1>
              <p style={{ margin: "4px 0 12px", fontSize: 13, color: theme.textDim }}>
                Type coverage · Matchup analysis · Gap suggestions
              </p>
            </div>
            <ThemeToggle dark={dark} onToggle={() => setDark(d => !d)} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {["Shield","Scarlet"].map(g => (
              <button key={g} onClick={() => { setGame(g); setOpponent(null); }}
                style={{
                  padding: "6px 16px", borderRadius: 6, border: "none", cursor: "pointer",
                  fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700,
                  background: game === g
                    ? (g === "Shield" ? "#6890f0" : "#e05040")
                    : theme.tagBg,
                  color: game === g ? "#fff" : theme.textDim,
                  transition: "all 0.15s",
                }}>
                {g}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "0 16px" }}>
        {/* Team Slots */}

          <h2 style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: theme.accent, margin: "0 0 4px", letterSpacing: 1 }}>
            YOUR TEAM ({activeTeam.length}/6)

            <p style={{ margin: "0 0 10px", fontSize: 12, color: theme.danger }}>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 8, marginTop: 10 }}>

                <div key={i} style={{
                  background: theme.panel, borderRadius: 8, padding: 10,

                  }}
                >
                  <option value="">Select opponent...</option>
                  {(OPPONENTS[game] || []).map(o => (
                    <option key={o.name} value={o.name}>{o.name}</option>
                  ))}
                </select>

                {opponentAnalysis && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {opponentAnalysis.map(({ opp, matchups, bestCounter }) => (
                      <div key={opp.name} style={{
                        background: theme.panel, borderRadius: 8, padding: 12,
                        border: `1px solid ${theme.border}`,
                      }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <span style={{ fontWeight: 700, fontSize: 14 }}>{opp.name}</span>
                          {opp.types.map(t => <TypeBadge key={t} type={t} small />)}
                        </div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {matchups.map(m => {
                            const isBest = m.myMon === bestCounter.myMon;
                            return (
                              <div key={m.myMon} style={{
                                padding: "4px 8px", borderRadius: 4, fontSize: 11,
                                background: isBest ? `${theme.accent}20` : theme.bg,
                                border: isBest ? `1px solid ${theme.accent}60` : `1px solid ${theme.border2}`,
                                fontFamily: "'Space Mono', monospace",
                              }}>
                                <span style={{ color: isBest ? theme.accent : theme.textDim }}>{m.myMon}</span>
                                <span style={{ color: m.myAtk > 1 ? "#3e9e5f" : m.myAtk < 1 ? theme.danger : theme.textDim, marginLeft: 6 }}>
                                  →{m.myAtk > 1 ? "SE" : m.myAtk < 1 ? "NVE" : "="} 
                                </span>
                                <span style={{ color: m.theirAtk > 1 ? theme.danger : m.theirAtk < 1 ? "#3e9e5f" : theme.textDim, marginLeft: 4 }}>
                                  ←{m.theirAtk > 1 ? "SE" : m.theirAtk < 1 ? "NVE" : "="}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{ marginTop: 6, fontSize: 11, color: theme.accent }}>
                          Best lead: <strong>{bestCounter.myMon}</strong>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {!opponent && (
                  <div style={{ color: theme.textFaint, fontSize: 13, fontFamily: "'Space Mono', monospace" }}>
                    Pick an opponent to see matchup analysis
                  </div>
                )}
              </div>
            )}

            {/* Suggestions Tab */}
            {tab === "suggest" && (
              <div>
                {activeTeam.length >= 6 ? (
                  <p style={{ color: theme.textDim, fontSize: 13 }}>Team is full. Remove a slot to see suggestions.</p>
                ) : suggestions.length === 0 ? (
                  <p style={{ color: theme.textDim, fontSize: 13 }}>No strong suggestions found.</p>
                ) : (
                  <>
                    <p style={{ fontSize: 12, color: theme.textDimmer, margin: "0 0 12px" }}>
                      Ranked by how well they cover your defensive weaknesses and offensive gaps.
                    </p>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {suggestions.map((s, i) => {
                        const weakTypes = defense.filter(d => d.bestMult >= 2).map(d => d.type);
                        const resistsWeak = weakTypes.filter(wt => getDefensiveMultiplier(wt, s.types) < 1);
                        const uncovered = offense.filter(o => !o.covered).map(o => o.type);
                        const coversGap = uncovered.filter(ut => s.types.some(t => getEffectiveness(t, ut) > 1));

                        return (
                          <div key={s.name} style={{
                            display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                            background: theme.panel, borderRadius: 8, border: `1px solid ${theme.border}`,
                            flexWrap: "wrap",
                          }}>
                            <span style={{
                              fontFamily: "'Space Mono', monospace", fontSize: 11, color: theme.textFaint,
                              minWidth: 20, textAlign: "right"
                            }}>#{i+1}</span>
                            <span style={{ fontWeight: 600, fontSize: 14, minWidth: 120 }}>{s.name}</span>
                            {s.types.map(t => <TypeBadge key={t} type={t} small />)}
                            <div style={{ flex: 1, display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
                              {resistsWeak.length > 0 && (
                                <span style={{ fontSize: 10, color: "#6890f0" }}>
                                  Resists: {resistsWeak.join(", ")}
                                </span>
                              )}
                              {coversGap.length > 0 && (
                                <span style={{ fontSize: 10, color: "#3e9e5f" }}>
                                  Covers: {coversGap.join(", ")}
                                </span>
                              )}
                            </div>
                            <button
                              onClick={() => {
                                const emptyIdx = team.findIndex(t => t === null);
                                if (emptyIdx !== -1) setSlot(emptyIdx, s);
                              }}
                              style={{
                                padding: "3px 10px", borderRadius: 4, border: `1px solid ${theme.accent}60`,
                                background: `${theme.accent}15`, color: theme.accent, cursor: "pointer",
                                fontFamily: "'Space Mono', monospace", fontSize: 11,
                              }}
                            >+ Add</button>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script src="/nav.js"></script>

</body>
</html>
