// Effectiveness chart: CHART[atk][def] = multiplier
// Only store non-1x values as sparse map for compactness
const E = { i: 0, h: 0.5, s: 2 }; // immune, half, super
const SPARSE = {
  Normal:   { Rock:"h", Ghost:"i", Steel:"h" },
  Fire:     { Fire:"h", Water:"h", Grass:"s", Ice:"s", Bug:"s", Rock:"h", Dragon:"h", Steel:"s" },

  Fighting: { Normal:"s", Ice:"s", Poison:"h", Flying:"h", Psychic:"h", Bug:"h", Rock:"s", Ghost:"i", Dark:"s", Steel:"s", Fairy:"h" },
  Poison:   { Grass:"s", Poison:"h", Ground:"h", Rock:"h", Ghost:"h", Steel:"i", Fairy:"s" },
  Ground:   { Fire:"s", Electric:"s", Grass:"h", Poison:"s", Flying:"i", Bug:"h", Rock:"s", Steel:"s" },
  Flying:   { Electric:"h", Grass:"s", Fighting:"s", Bug:"s", Rock:"h", Steel:"h" },
  Psychic:  { Fighting:"s", Poison:"s", Psychic:"h", Dark:"i", Steel:"h" },
  Bug:      { Fire:"h", Grass:"s", Fighting:"h", Poison:"h", Flying:"h", Psychic:"s", Ghost:"h", Dark:"s", Steel:"h", Fairy:"h" },
  Rock:     { Fire:"s", Ice:"s", Fighting:"h", Ground:"h", Flying:"s", Bug:"s", Steel:"h" },
  Ghost:    { Normal:"i", Psychic:"s", Ghost:"s", Dark:"h" },
  Dragon:   { Dragon:"s", Steel:"h", Fairy:"i" },
  Dark:     { Fighting:"h", Psychic:"s", Ghost:"s", Dark:"h", Fairy:"h" },
  Steel:    { Fire:"h", Water:"h", Electric:"h", Ice:"s", Rock:"s", Steel:"h", Fairy:"s" },
  Fairy:    { Fire:"h", Poison:"h", Fighting:"s", Dragon:"s", Dark:"s", Steel:"h" },
};

function getEffectiveness(atkType, defType) {
  const entry = SPARSE[atkType]?.[defType];
  return entry ? E[entry] : 1;
}

function getDefensiveMultiplier(atkType, defTypes) {
  return defTypes.reduce((m, dt) => m * getEffectiveness(atkType, dt), 1);
}

// ── ANALYSIS ENGINE ──────────────────────────────────────────────────────────
function analyzeTeamDefense(team) {
  // For each attacking type, find best (lowest) multiplier across team
  return TYPES.map(atkType => {
    const matchups = team.map(p => ({
      name: p.name,
      mult: getDefensiveMultiplier(atkType, p.types)
    }));
    const best = Math.min(...matchups.map(m => m.mult));
    const worst = Math.max(...matchups.map(m => m.mult));
    const immuneMon = matchups.find(m => m.mult === 0);
    const resistMon = matchups.find(m => m.mult < 1 && m.mult > 0);
    const weakMons = matchups.filter(m => m.mult > 1);
    return {
      type: atkType,
      bestMult: best,
      worstMult: worst,
      immuneMon, resistMon,
      weakCount: weakMons.length,
      weakMons,
      teamSize: team.length
    };
  });
}

function analyzeTeamOffense(team) {
  // For each defending type, check if any team member has STAB coverage
  return TYPES.map(defType => {
    const coverage = team.flatMap(p =>
      p.types.map(t => ({ name: p.name, atkType: t, mult: getEffectiveness(t, defType) }))
    );
    const superEffective = coverage.filter(c => c.mult > 1);
    const bestMult = Math.max(...coverage.map(c => c.mult), 0);
    return {
      type: defType,
      covered: superEffective.length > 0,
      bestMult,
      coveredBy: superEffective
    };
  });
}

function suggestPokemon(team, game, limit = 8) {
  const defense = analyzeTeamDefense(team);
  const offense = analyzeTeamOffense(team);
  const weakTypes = defense.filter(d => d.bestMult >= 2).map(d => d.type);
  const uncoveredTypes = offense.filter(o => !o.covered).map(o => o.type);
  const teamNames = new Set(team.map(p => p.name));
  const candidates = POKEMON
    .filter(p => (game === "Both" || p.game === "B" || p.game === game[0]))
    .filter(p => !teamNames.has(p.name));

  const scored = candidates.map(p => {
    let score = 0;
    // Reward: resists team weaknesses
    for (const wt of weakTypes) {
      const mult = getDefensiveMultiplier(wt, p.types);
      if (mult === 0) score += 3;
      else if (mult < 1) score += 2;
    }
    // Reward: STAB covers uncovered types
    for (const ut of uncoveredTypes) {
      for (const t of p.types) {
        if (getEffectiveness(t, ut) > 1) score += 1.5;
      }
    }
    return { ...p, score };
  });

  return scored.sort((a, b) => b.score - a.score).slice(0, limit);
}

// ── PLAIN-ENGLISH SUMMARY ENGINE ─────────────────────────────────────────────
// Rule-based. Deterministic, no network, no API. Fixed severity vocabulary:
//   critical | notable | minor | clean

function listPhrase(arr, cap = 5) {
  if (arr.length === 0) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length > cap) {
    const shown = arr.slice(0, cap);
    const rest = arr.length - cap;
    return `${shown.join(", ")}, and ${rest} more`;
  }
  if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")}, and ${arr[arr.length - 1]}`;
}

function coverageSummary(defense, offense, teamSize, game) {
  // Exposed = nothing on the team resists it (best multiplier >= 2)
  const exposed = defense
    .filter(d => d.bestMult >= 2)
    .sort((a, b) => (b.bestMult - a.bestMult) || (b.weakCount - a.weakCount));
  // Crowded = many members weak, even if something resists
  const crowded = defense.filter(d => d.weakCount >= Math.ceil(teamSize / 2) && d.bestMult < 2);
  const uncovered = offense.filter(o => !o.covered).map(o => o.type);

  // Severity weighs BOTH defensive holes and offensive gaps.
  let severity, headline;
  if (exposed.length >= 3) {
    severity = "critical";
    headline = `${exposed.length} attack types can hit your whole team hard with nothing to switch into.`;
  } else if (exposed.length > 0 && uncovered.length >= 6) {
    severity = "critical";
    headline = `${exposed.length === 1 ? "One attack type gets" : `${exposed.length} attack types get`} through unresisted, and you can't hit ${uncovered.length} types hard — problems on both sides.`;
  } else if (exposed.length > 0) {
    severity = "notable";
    headline = `${exposed.length === 1 ? "One attack type gets" : `${exposed.length} attack types get`} through your team unresisted.`;
  } else if (uncovered.length >= 4) {
    severity = "notable";
    headline = `Defensively you're airtight, but there are ${uncovered.length} types you can't hit hard.`;
  } else if (crowded.length > 0 || uncovered.length > 0) {
    severity = "minor";
    headline = exposed.length === 0 && crowded.length === 0
      ? "Defensively solid, with a few gaps on the attacking side."
      : "Nothing gets through unresisted, but a few types hit several of your team at once.";
  } else {
    severity = "clean";
    headline = "No defensive holes and no coverage gaps — this team is balanced on type alone.";
  }

  // ── READ (factual)
  const read = [];
  read.push(headline);
  if (exposed.length > 0) {
    const worst = exposed[0];
    read.push(
      `Worst of them is ${worst.type}: ${worst.weakCount === teamSize ? `all ${teamSize} of your team take` : `${worst.weakCount} of your ${teamSize} take`} super-effective damage from it and none resist it.`
    );
    if (exposed.length > 1) {
      read.push(`Also unresisted: ${listPhrase(exposed.slice(1).map(e => e.type))}.`);
    }
  }
  if (crowded.length > 0) {
    read.push(
      `${listPhrase(crowded.map(c => c.type))} ${crowded.length === 1 ? "hits" : "hit"} half or more of your team, though you do have a switch-in.`
    );
  }
  if (uncovered.length > 0) {
    read.push(
      `Offensively you have no same-type attack that's super-effective against ${listPhrase(uncovered)} — expect those fights to be slow.`
    );
  } else {
    read.push("Offensively you can hit every type super-effectively with a same-type attack.");
  }

  // ── ACT (opinionated)
  const act = [];
  if (exposed.length > 0) {
    const worst = exposed[0];
    act.push(
      `Priority is a ${worst.type} resist — that's the hole most likely to lose you a fight. The Suggestions tab ranks candidates that plug it.`
    );
  }
  if (uncovered.length >= 3) {
    act.push(
      `${act.length ? "You're also missing" : "Your gap is"} super-effective coverage on ${uncovered.length} types (${listPhrase(uncovered)}). A coverage move from your TM/TR stock is usually a cheaper fix than swapping a team member.`
    );
  } else if (uncovered.length > 0) {
    act.push(
      `For ${listPhrase(uncovered)}, a coverage move is likely easier than changing your team.`
    );
  }
  if (exposed.length === 0 && uncovered.length === 0 && crowded.length === 0) {
    act.push("No structural gaps to fix. Tune movesets, levels, and held items rather than swapping members.");
  }
  if (teamSize < 6) {
    act.push(`You have ${6 - teamSize} open ${6 - teamSize === 1 ? "slot" : "slots"} — cheapest place to fix any of the above.`);
  }

  return { severity, read, act };
}

function matchupSummary(analysis, opponentName, teamSize) {
  const total = analysis.length;
  // A mon is "answered" if someone on your team hits it super-effectively
  const answered = analysis.filter(a => a.matchups.some(m => m.myAtk > 1));
  // A mon is "threatening" if it hits someone super-effectively AND you can't hit it back hard
  const problems = analysis.filter(
    a => !a.matchups.some(m => m.myAtk > 1) && a.matchups.some(m => m.theirAtk > 1)
  );
  // Count how often each of your mons is the recommended lead
  const leadCounts = {};
  analysis.forEach(a => {
    leadCounts[a.bestCounter.myMon] = (leadCounts[a.bestCounter.myMon] || 0) + 1;
  });
  const topLead = Object.entries(leadCounts).sort((a, b) => b[1] - a[1])[0];

  let severity, headline;
  const ratio = answered.length / total;
  if (problems.length === 0 && ratio === 1) {
    severity = "clean";
    headline = `You have a super-effective answer to all ${total} of ${opponentName}'s Pokémon.`;
  } else if (problems.length === 0) {
    severity = "minor";
    headline = `You answer ${answered.length} of ${total}, and nothing on their side outright threatens you unanswered.`;
  } else if (problems.length === 1) {
    severity = "notable";
    headline = `You answer ${answered.length} of ${total}, but one of theirs threatens you with no super-effective reply.`;
  } else {
    severity = "critical";
    headline = `${problems.length} of ${opponentName}'s ${total} threaten your team with no super-effective reply from you.`;
  }

  // ── READ (factual)
  const read = [];
  read.push(headline);
  if (topLead) {
    read.push(
      `${topLead[0]} is the best answer to ${topLead[1]} of their ${total}${topLead[1] > 1 ? " — your most broadly useful pick here" : ""}.`
    );
  }
  if (problems.length > 0) {
    read.push(`No super-effective answer to: ${listPhrase(problems.map(p => p.opp.name))}.`);
  }

  // ── ACT (opinionated)
  const act = [];
  if (topLead && topLead[1] > 1) {
    act.push(`Lead ${topLead[0]}. It covers the most of their roster, so it forces them to react first.`);
  } else if (topLead) {
    act.push(`No single lead covers much here — expect to switch a lot. ${topLead[0]} is the safest opener.`);
  }
  if (problems.length > 0) {
    act.push(
      `For ${listPhrase(problems.map(p => p.opp.name))} you'll be trading neutral damage, so bring your bulkiest member in and win on stats rather than type advantage. A coverage move on any team member would turn ${problems.length === 1 ? "that fight" : "those fights"} around.`
    );
  }
  if (severity === "clean") {
    act.push("This matchup is in your favour on type alone. Levels and movesets are what's left to get right.");
  }

  return { severity, read, act };
}

function suggestionsSummary(suggestions, defense, offense, game) {
  if (suggestions.length === 0) return null;
  const top = suggestions[0];
  const weakTypes = defense.filter(d => d.bestMult >= 2).map(d => d.type);
  const uncovered = offense.filter(o => !o.covered).map(o => o.type);

  const topResists = weakTypes.filter(wt => getDefensiveMultiplier(wt, top.types) < 1);
  const topCovers = uncovered.filter(ut => top.types.some(t => getEffectiveness(t, ut) > 1));
  const doesBoth = topResists.length > 0 && topCovers.length > 0;

  // How many of the listed candidates solve both problems?
  const bothCount = suggestions.filter(s => {
    const r = weakTypes.some(wt => getDefensiveMultiplier(wt, s.types) < 1);
    const c = uncovered.some(ut => s.types.some(t => getEffectiveness(t, ut) > 1));
    return r && c;
  }).length;

  let severity, headline;
  if (weakTypes.length === 0 && uncovered.length === 0) {
    severity = "clean";
    headline = "Your team has no defensive holes or coverage gaps — these are ranked on general type value only.";
  } else if (doesBoth) {
    severity = "notable";
    headline = `${top.name} is the strongest fit: it patches a defensive hole and a coverage gap at once.`;
  } else {
    severity = "minor";
    headline = `${top.name} ranks first, but no available Pokémon fixes both your defensive and offensive gaps together.`;
  }

  // ── READ (factual)
  const read = [];
  read.push(headline);
  if (topResists.length > 0) {
    read.push(`It resists ${listPhrase(topResists)}, which nothing on your team currently does.`);
  }
  if (topCovers.length > 0) {
    read.push(`It ${topResists.length > 0 ? "also " : ""}gives you super-effective coverage on ${listPhrase(topCovers)}, which your team currently lacks.`);
  }
  read.push(
    `Ranking is based on type matchups only — it doesn't account for base stats, abilities, held items, or what you can realistically catch right now.`
  );

  // ── ACT (opinionated)
  const act = [];
  if (doesBoth) {
    act.push(
      `Take ${top.name} if you can get one.${bothCount > 1 ? ` ${bothCount - 1} other ${bothCount - 1 === 1 ? "option" : "options"} below also solve both, so pick whichever you prefer or already own.` : " Nothing else on this list solves both problems."}`
    );
  } else if (weakTypes.length > 0 && uncovered.length > 0) {
    act.push(
      `Since no single addition fixes everything, decide which hurts more: the defensive hole (you lose Pokémon) or the coverage gap (fights drag on). Defensive holes are usually the more urgent of the two mid-playthrough.`
    );
  } else if (weakTypes.length > 0) {
    act.push(
      `Your only real problem is defensive. Take whichever option above resists ${listPhrase(weakTypes)} and don't overthink the offensive side.`
    );
  } else if (uncovered.length > 0) {
    act.push(
      `You have no defensive holes, so this is purely about offence. A coverage move on an existing member is usually cheaper than adding ${top.name} just for the typing — only take it if you'd enjoy using it.`
    );
  } else {
    act.push("Nothing here is a fix for a real problem — only add one if you actually like it.");
  }
  act.push("Whatever you pick, re-check the Coverage tab afterwards; adding a member can open a new weakness while closing another.");

  return { severity, read, act };
}

// ── SUMMARY CARD ─────────────────────────────────────────────────────────────
const SEVERITY_META = {
  critical: { label: "CRITICAL",  color: "#e05040", lightColor: "#c23b2a" },
  notable:  { label: "NOTABLE",   color: "#f0a030", lightColor: "#b06a12" },
  minor:    { label: "MINOR",     color: "#6890f0", lightColor: "#3a63c4" },
  clean:    { label: "CLEAN",     color: "#3e9e5f", lightColor: "#2a7a45" },
};

function SummaryCard({ summary, theme }) {
  if (!summary) return null;
  const meta = SEVERITY_META[summary.severity] || SEVERITY_META.minor;
  const accent = theme.dark ? meta.color : meta.lightColor;

  return (
    <div style={{
      background: theme.panel,
      border: `1px solid ${theme.border}`,
      borderLeft: `3px solid ${accent}`,
      borderRadius: 8,
      padding: "14px 16px",
      marginBottom: 20,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{
          fontFamily: "'Space Mono', monospace",
          fontSize: 9,
          fontWeight: 700,
          letterSpacing: 1.5,
          color: "#fff",
          background: accent,
          padding: "2px 7px",
          borderRadius: 3,
        }}>{meta.label}</span>
        <span style={{
          fontFamily: "'Space Mono', monospace",
          fontSize: 10,
          letterSpacing: 1.5,
          color: theme.textDimmer,
          textTransform: "uppercase",
        }}>In plain English</span>
      </div>

      <div style={{ marginBottom: 12 }}>
        <div style={{
          fontFamily: "'Space Mono', monospace", fontSize: 9, letterSpacing: 1.5,
          color: theme.textDimmer, textTransform: "uppercase", marginBottom: 5,
        }}>What the numbers say</div>
        {summary.read.map((line, i) => (
          <p key={i} style={{
            margin: "0 0 5px", fontSize: 13.5, lineHeight: 1.55, color: theme.text,
          }}>{line}</p>
        ))}
      </div>

      {summary.act.length > 0 && (
        <div style={{
          borderTop: `1px solid ${theme.border2}`,
          paddingTop: 10,
        }}>
          <div style={{
            fontFamily: "'Space Mono', monospace", fontSize: 9, letterSpacing: 1.5,
            color: theme.textDimmer, textTransform: "uppercase", marginBottom: 5,
          }}>What I'd do — opinion, not fact</div>
          {summary.act.map((line, i) => (
            <p key={i} style={{
              margin: "0 0 5px", fontSize: 13.5, lineHeight: 1.55, color: theme.textDim,
            }}>{line}</p>
          ))}
        </div>
      )}
    </div>
  );
}

// ── UI COMPONENTS ────────────────────────────────────────────────────────────
const TypeBadge = ({ type, small }) => (
  <span style={{
    display: "inline-block",
    padding: small ? "1px 6px" : "2px 10px",
    borderRadius: 4,
    fontSize: small ? 10 : 12,
    fontWeight: 700,
    fontFamily: "'Space Mono', monospace",
    color: "#fff",
    background: TYPE_COLORS[type],
    textShadow: "0 1px 2px rgba(0,0,0,0.4)",
    letterSpacing: 0.5,
  }}>{type}</span>
);

const MultBadge = ({ mult }) => {
  const bg = mult === 0 ? "#333" : mult < 1 ? "#2a6e3f" : mult === 1 ? "#555" : mult <= 2 ? "#b85c1f" : "#a02020";
  const label = mult === 0 ? "0×" : mult === 0.25 ? "¼×" : mult === 0.5 ? "½×" : `${mult}×`;
  return (
    <span style={{
      display: "inline-block", padding: "1px 6px", borderRadius: 3,
      fontSize: 11, fontWeight: 700, fontFamily: "'Space Mono', monospace",
      color: "#fff", background: bg, minWidth: 28, textAlign: "center"
    }}>{label}</span>
  );
};

function ThemeToggle({ dark, onToggle }) {
  return (
    <button
      onClick={onToggle}
      aria-label={dark ? "Switch to light mode" : "Switch to dark mode"}
      style={{
        width: 36, height: 36, borderRadius: 8, cursor: "pointer",
        border: dark ? "1px solid #333" : "1px solid #ddd8c9",
        background: dark ? "#1a1e28" : "#ffffff",
        color: dark ? "#e8e6dc" : "#231f16",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 16, flexShrink: 0,
      }}
    >
      {dark ? "☀" : "☾"}
    </button>
  );
}

function PokemonSearch({ value, onChange, game, placeholder, theme }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);

  const filtered = useMemo(() => {
    if (!query) return [];
    const q = query.toLowerCase();
    return POKEMON
      .filter(p => (game === "Both" || p.game === "B" || p.game === game[0]))
      .filter(p => p.name.toLowerCase().includes(q))
      .slice(0, 12);
  }, [query, game]);

  return (
    <div style={{ position: "relative" }}>
      <input
        type="text"
        value={value ? value.name : query}
        placeholder={placeholder || "Search Pokémon..."}
        onChange={e => { setQuery(e.target.value); onChange(null); setOpen(true); }}
        onFocus={() => { if (!value) setOpen(true); }}
        style={{
          width: "100%", padding: "8px 10px", borderRadius: 6,
          border: `1px solid ${theme.border}`, background: theme.inputBg, color: theme.text,
          fontFamily: "'Space Mono', monospace", fontSize: 13, boxSizing: "border-box"
        }}
      />
      {value && (
        <button onClick={() => { onChange(null); setQuery(""); }}
          style={{
            position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)",
            background: "none", border: "none", color: theme.textDim, cursor: "pointer", fontSize: 16
          }}>×</button>
      )}
      {open && filtered.length > 0 && !value && (
        <div style={{
          position: "absolute", top: "100%", left: 0, right: 0, zIndex: 100,
          background: theme.panel2, border: `1px solid ${theme.border}`, borderRadius: 6,
          maxHeight: 200, overflowY: "auto", marginTop: 2,
        }}>
          {filtered.map(p => (
            <div key={p.name}
              onClick={() => { onChange(p); setQuery(""); setOpen(false); }}
              style={{
                padding: "6px 10px", cursor: "pointer", display: "flex",
                alignItems: "center", gap: 6, borderBottom: `1px solid ${theme.border2}`
              }}
              onMouseEnter={e => e.currentTarget.style.background = theme.panel3}
              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
            >
              <span style={{ color: theme.text, fontSize: 13, flex: 1 }}>{p.name}</span>
              {p.types.map(t => <TypeBadge key={t} type={t} small />)}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [dark, setDark] = useState(true);
  const theme = getTheme(dark);

  const [game, setGame] = useState("Shield");
  const [team, setTeam] = useState([null, null, null, null, null, null]);
  const [tab, setTab] = useState("coverage");
  const [opponent, setOpponent] = useState(null);

  const gameLetter = game[0]; // "S" or "R"
  const isValidForGame = useCallback((p) => !p || p.game === "B" || p.game === gameLetter, [gameLetter]);

  // Only Pokémon valid for the current game feed the analysis engines.
  const activeTeam = team.filter(p => p && isValidForGame(p));
  const invalidSlots = team.filter(p => p && !isValidForGame(p));

  const defense = useMemo(() => activeTeam.length ? analyzeTeamDefense(activeTeam) : [], [activeTeam]);
  const offense = useMemo(() => activeTeam.length ? analyzeTeamOffense(activeTeam) : [], [activeTeam]);
  const suggestions = useMemo(() =>
    activeTeam.length >= 1 && activeTeam.length < 6
      ? suggestPokemon(activeTeam, game)
      : [],
    [activeTeam, game]
  );

  const setSlot = useCallback((i, p) => {
    setTeam(t => { const n = [...t]; n[i] = p; return n; });
  }, []);

  const opponentAnalysis = useMemo(() => {
    if (!opponent || !activeTeam.length) return null;
    return opponent.pokemon.map(opp => {
      const matchups = activeTeam.map(mine => {
        // My offensive STAB vs their types
        const myAtk = Math.max(...mine.types.map(t =>
          opp.types.reduce((m, dt) => m * getEffectiveness(t, dt), 1)
        ));
        // Their offensive STAB vs my types
        const theirAtk = Math.max(...opp.types.map(t =>
          mine.types.reduce((m, dt) => m * getEffectiveness(t, dt), 1)
        ));
        return { myMon: mine.name, myAtk, theirAtk };
      });
      const bestCounter = matchups.reduce((best, m) =>
        (m.myAtk > best.myAtk || (m.myAtk === best.myAtk && m.theirAtk < best.theirAtk)) ? m : best
      , matchups[0]);
      return { opp, matchups, bestCounter };
    });
  }, [opponent, activeTeam]);

  const coverageSummaryData = useMemo(
    () => (activeTeam.length ? coverageSummary(defense, offense, activeTeam.length, game) : null),
    [defense, offense, activeTeam.length, game]
  );
  const matchupSummaryData = useMemo(
    () => (opponentAnalysis && opponent ? matchupSummary(opponentAnalysis, opponent.name, activeTeam.length) : null),
    [opponentAnalysis, opponent, activeTeam.length]
  );
  const suggestSummaryData = useMemo(
    () => (suggestions.length ? suggestionsSummary(suggestions, defense, offense, game) : null),
    [suggestions, defense, offense, game]
  );

  return (
    <div style={{
      minHeight: "100vh", background: theme.bg, color: theme.text,
      fontFamily: "'Inter', 'Helvetica Neue', sans-serif", padding: "0 0 40px",
      transition: "background 0.15s, color 0.15s",
    }}>
      {/* Header */}
      <div style={{
        background: `linear-gradient(135deg, ${theme.headerGradFrom} 0%, ${theme.headerGradTo} 100%)`,
        borderBottom: `1px solid ${theme.border}`, padding: "20px 16px 16px",
      }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <div>
              <h1 style={{
                fontFamily: "'Space Mono', monospace", fontSize: 22, margin: 0,
                color: theme.accent, letterSpacing: 1,
              }}>TEAM BUILDER</h1>
              <p style={{ margin: "4px 0 12px", fontSize: 13, color: theme.textDim }}>
                Type coverage · Matchup analysis · Gap suggestions
              </p>
            </div>
            <ThemeToggle dark={dark} onToggle={() => setDark(d => !d)} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {["Shield","Scarlet"].map(g => (
              <button key={g} onClick={() => { setGame(g); setOpponent(null); }}
                style={{
                  padding: "6px 16px", borderRadius: 6, border: "none", cursor: "pointer",
                  fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700,
                  background: game === g
                    ? (g === "Shield" ? "#6890f0" : "#e05040")
                    : theme.tagBg,
                  color: game === g ? "#fff" : theme.textDim,
                  transition: "all 0.15s",
                }}>
                {g}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "0 16px" }}>
        {/* Team Slots */}
        <div style={{ margin: "20px 0 16px" }}>
          <h2 style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: theme.accent, margin: "0 0 4px", letterSpacing: 1 }}>
            YOUR TEAM ({activeTeam.length}/6)
          </h2>
          {invalidSlots.length > 0 && (
            <p style={{ margin: "0 0 10px", fontSize: 12, color: theme.danger }}>
              {invalidSlots.length} Pokémon not available in {game} — flagged below, excluded from analysis
            </p>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 8, marginTop: 10 }}>
            {team.map((slot, i) => {
              const valid = isValidForGame(slot);
              return (
                <div key={i} style={{
                  background: theme.panel, borderRadius: 8, padding: 10,
                  border: slot
                    ? (valid ? `1px solid ${TYPE_COLORS[slot.types[0]]}33` : `1px solid ${theme.warnBorder}`)
                    : `1px solid ${theme.border}`,
                }}>
                  {slot ? (
                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 14, fontWeight: 600, flex: 1, opacity: valid ? 1 : 0.6 }}>{slot.name}</span>
                        {slot.types.map(t => <TypeBadge key={t} type={t} small />)}
                        <button onClick={() => setSlot(i, null)}
                          style={{ background: "none", border: "none", color: theme.textDimmer, cursor: "pointer", fontSize: 14 }}>×</button>
                      </div>
                      {!valid && (
                        <div style={{ fontSize: 10, color: theme.danger, marginTop: 4, fontFamily: "'Space Mono', monospace" }}>
                          ⚠ Not available in {game}
                        </div>
                      )}
                    </div>
                  ) : (
                    <PokemonSearch value={null} onChange={p => setSlot(i, p)} game={game} placeholder={`Slot ${i+1}`} theme={theme} />
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {activeTeam.length === 0 && (
          <div style={{ textAlign: "center", padding: "40px 0", color: theme.textFaint, fontFamily: "'Space Mono', monospace", fontSize: 13 }}>
            Add Pokémon to your team to begin analysis
          </div>
        )}

        {activeTeam.length > 0 && (
          <>
            {/* Tab bar */}
            <div style={{ display: "flex", gap: 4, margin: "8px 0 16px", borderBottom: `1px solid ${theme.border}`, paddingBottom: 8 }}>
              {[
                ["coverage", "Coverage"],
                ["matchup", "Matchup"],
                ["suggest", `Suggestions${suggestions.length ? ` (${suggestions.length})` : ""}`],
              ].map(([id, label]) => (
                <button key={id} onClick={() => setTab(id)}
                  style={{
                    padding: "6px 14px", borderRadius: 6, border: "none", cursor: "pointer",
                    fontFamily: "'Space Mono', monospace", fontSize: 12,
                    background: tab === id ? `${theme.accent}20` : "transparent",
                    color: tab === id ? theme.accent : theme.textDim,
                    fontWeight: tab === id ? 700 : 400,
                  }}>{label}</button>
              ))}
            </div>

            {/* Coverage Tab */}
            {tab === "coverage" && (
              <div>
                <SummaryCard summary={coverageSummaryData} theme={theme} />
                <h3 style={{ fontFamily: "'Space Mono', monospace", fontSize: 13, color: "#6890f0", margin: "0 0 8px" }}>
                  DEFENSIVE — Incoming Attacks
                </h3>
                <p style={{ fontSize: 12, color: theme.textDimmer, margin: "0 0 12px" }}>
                  How your team handles each attacking type
                </p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 6, marginBottom: 24 }}>
                  {defense.map(d => {
                    const danger = d.bestMult >= 2;
                    const safe = d.bestMult === 0 || d.bestMult <= 0.5;
                    return (
                      <div key={d.type} style={{
                        display: "flex", alignItems: "center", gap: 8, padding: "6px 10px",
                        borderRadius: 6,
                        background: danger ? "#e0504015" : safe ? "#2a6e3f15" : theme.panel,
                        border: `1px solid ${danger ? "#e0504040" : safe ? "#2a6e3f40" : theme.border2}`,
                      }}>
                        <TypeBadge type={d.type} small />
                        <MultBadge mult={d.bestMult} />
                        {danger && <span style={{ fontSize: 10, color: theme.danger, fontWeight: 700 }}>EXPOSED</span>}
                        {d.weakCount >= 3 && <span style={{ fontSize: 10, color: "#f08030" }}>({d.weakCount} weak)</span>}
                      </div>
                    );
                  })}
                </div>

                <h3 style={{ fontFamily: "'Space Mono', monospace", fontSize: 13, color: "#78c850", margin: "0 0 8px" }}>
                  OFFENSIVE — STAB Coverage
                </h3>
                <p style={{ fontSize: 12, color: theme.textDimmer, margin: "0 0 12px" }}>
                  Types your team hits super-effectively via STAB
                </p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 6 }}>
                  {offense.map(o => (
                    <div key={o.type} style={{
                      display: "flex", alignItems: "center", gap: 8, padding: "6px 10px",
                      borderRadius: 6,
                      background: o.covered ? "#2a6e3f15" : "#e0504015",
                      border: `1px solid ${o.covered ? "#2a6e3f40" : "#e0504040"}`,
                    }}>
                      <TypeBadge type={o.type} small />
                      {o.covered
                        ? <span style={{ fontSize: 11, color: "#3e9e5f" }}>✓ {o.coveredBy.map(c => c.name).filter((v,i,a)=>a.indexOf(v)===i).join(", ")}</span>
                        : <span style={{ fontSize: 11, color: theme.danger, fontWeight: 700 }}>NO STAB COVERAGE</span>
                      }
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Matchup Tab */}
            {tab === "matchup" && (
              <div>
                <h3 style={{ fontFamily: "'Space Mono', monospace", fontSize: 13, color: theme.accent, margin: "0 0 10px" }}>
                  OPPONENT
                </h3>
                <select
                  value={opponent ? opponent.name : ""}
                  onChange={e => {
                    const opp = OPPONENTS[game]?.find(o => o.name === e.target.value);
                    setOpponent(opp || null);
                  }}
                  style={{
                    width: "100%", maxWidth: 320, padding: "8px 10px", borderRadius: 6,
                    border: `1px solid ${theme.border}`, background: theme.inputBg, color: theme.text,
                    fontFamily: "'Space Mono', monospace", fontSize: 13, marginBottom: 16,
                  }}
                >
                  <option value="">Select opponent...</option>
                  {(OPPONENTS[game] || []).map(o => (
                    <option key={o.name} value={o.name}>{o.name}</option>
                  ))}
                </select>

                {opponentAnalysis && <SummaryCard summary={matchupSummaryData} theme={theme} />}

                {opponentAnalysis && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {opponentAnalysis.map(({ opp, matchups, bestCounter }) => (
                      <div key={opp.name} style={{
                        background: theme.panel, borderRadius: 8, padding: 12,
                        border: `1px solid ${theme.border}`,
                      }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <span style={{ fontWeight: 700, fontSize: 14 }}>{opp.name}</span>
                          {opp.types.map(t => <TypeBadge key={t} type={t} small />)}
                        </div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {matchups.map(m => {
                            const isBest = m.myMon === bestCounter.myMon;
                            return (
                              <div key={m.myMon} style={{
                                padding: "4px 8px", borderRadius: 4, fontSize: 11,
                                background: isBest ? `${theme.accent}20` : theme.bg,
                                border: isBest ? `1px solid ${theme.accent}60` : `1px solid ${theme.border2}`,
                                fontFamily: "'Space Mono', monospace",
                              }}>
                                <span style={{ color: isBest ? theme.accent : theme.textDim }}>{m.myMon}</span>
                                <span style={{ color: m.myAtk > 1 ? "#3e9e5f" : m.myAtk < 1 ? theme.danger : theme.textDim, marginLeft: 6 }}>
                                  →{m.myAtk > 1 ? "SE" : m.myAtk < 1 ? "NVE" : "="} 
                                </span>
                                <span style={{ color: m.theirAtk > 1 ? theme.danger : m.theirAtk < 1 ? "#3e9e5f" : theme.textDim, marginLeft: 4 }}>
                                  ←{m.theirAtk > 1 ? "SE" : m.theirAtk < 1 ? "NVE" : "="}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{ marginTop: 6, fontSize: 11, color: theme.accent }}>
                          Best lead: <strong>{bestCounter.myMon}</strong>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {!opponent && (
                  <div style={{ color: theme.textFaint, fontSize: 13, fontFamily: "'Space Mono', monospace" }}>
                    Pick an opponent to see matchup analysis
                  </div>
                )}
              </div>
            )}

            {/* Suggestions Tab */}
            {tab === "suggest" && (
              <div>
                {activeTeam.length >= 6 ? (
                  <p style={{ color: theme.textDim, fontSize: 13 }}>Team is full. Remove a slot to see suggestions.</p>
                ) : suggestions.length === 0 ? (
                  <p style={{ color: theme.textDim, fontSize: 13 }}>No strong suggestions found.</p>
                ) : (
                  <>
                    <SummaryCard summary={suggestSummaryData} theme={theme} />
                    <p style={{ fontSize: 12, color: theme.textDimmer, margin: "0 0 12px" }}>
                      Ranked by how well they cover your defensive weaknesses and offensive gaps.
                    </p>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {suggestions.map((s, i) => {
                        const weakTypes = defense.filter(d => d.bestMult >= 2).map(d => d.type);
                        const resistsWeak = weakTypes.filter(wt => getDefensiveMultiplier(wt, s.types) < 1);
                        const uncovered = offense.filter(o => !o.covered).map(o => o.type);
                        const coversGap = uncovered.filter(ut => s.types.some(t => getEffectiveness(t, ut) > 1));

                        return (
                          <div key={s.name} style={{
                            display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                            background: theme.panel, borderRadius: 8, border: `1px solid ${theme.border}`,
                            flexWrap: "wrap",
                          }}>
                            <span style={{
                              fontFamily: "'Space Mono', monospace", fontSize: 11, color: theme.textFaint,
                              minWidth: 20, textAlign: "right"
                            }}>#{i+1}</span>
                            <span style={{ fontWeight: 600, fontSize: 14, minWidth: 120 }}>{s.name}</span>
                            {s.types.map(t => <TypeBadge key={t} type={t} small />)}
                            <div style={{ flex: 1, display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
                              {resistsWeak.length > 0 && (
                                <span style={{ fontSize: 10, color: "#6890f0" }}>
                                  Resists: {resistsWeak.join(", ")}
                                </span>
                              )}
                              {coversGap.length > 0 && (
                                <span style={{ fontSize: 10, color: "#3e9e5f" }}>
                                  Covers: {coversGap.join(", ")}
                                </span>
                              )}
                            </div>
                            <button
                              onClick={() => {
                                const emptyIdx = team.findIndex(t => t === null);
                                if (emptyIdx !== -1) setSlot(emptyIdx, s);
                              }}
                              style={{
                                padding: "3px 10px", borderRadius: 4, border: `1px solid ${theme.accent}60`,
                                background: `${theme.accent}15`, color: theme.accent, cursor: "pointer",
                                fontFamily: "'Space Mono', monospace", fontSize: 11,
                              }}
                            >+ Add</button>
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script src="/nav.js"></script>

</body>
